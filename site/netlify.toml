# Netlify configuration for liar-entertainer.com
#
# IMPORTANT: this file lives in site/. In the Netlify UI set
#   Base directory = site   (Netlify then reads this file; paths below are relative to site/)
# Redirects: public/_redirects (converted from ops/legacy-apache/.htaccess, tested by
# tests/dist/redirects.test.ts). www -> apex is the first rule there.
# No Content-Security-Policy on purpose (YouTube facade, Netlify Forms) — add only after testing.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Security headers (as on Apache, without HSTS includeSubDomains: Netlify sends its own HSTS)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build assets: cache forever
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
